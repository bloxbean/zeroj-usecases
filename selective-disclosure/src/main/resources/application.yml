server:
  port: 8085

spring:
  application:
    name: selective-disclosure-demo

cardano:
  network: yaci
  yaci:
    base-url: http://localhost:8080/api/v1/
    admin-url: http://localhost:10000
    mnemonic: "test test test test test test test test test test test test test test test test test test test test test test test sauce"

zk:
  # Both predicate circuits are below 2^14 constraints. Raise this if the
  # capacity regression test reports that a future circuit revision outgrows it.
  pot-power: 14

credential:
  current-year: 2026

demo:
  # Demo data directory (/app/data in Docker): the issuer key, its deployment state and the
  # setup cache. ./demo.sh selective-disclosure --clean-cache removes them together (ADR-0009 D11).
  data-dir: ${DEMO_DATA_DIR:./data}
