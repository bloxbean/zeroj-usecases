server:
  port: 8086

spring:
  application:
    name: private-voting-demo

cardano:
  network: yaci

  yaci:
    base-url: http://localhost:8080/api/v1/
    admin-url: http://localhost:10000
    mnemonic: "test test test test test test test test test test test test test test test test test test test test test test test sauce"

  preprod:
    blockfrost-url: https://cardano-preprod.blockfrost.io/api/v0
    blockfrost-project-id: ${BLOCKFROST_PROJECT_ID:}

zk:
  tree-depth: 10

election:
  # Number of test voter accounts to create at startup
  voter-count: 5
  # Default election name
  default-name: "ZeroJ DAO Proposal #1"
  # Trustees who jointly hold the election key (n-of-n; all are needed to decrypt the tally)
  trustee-count: 3
  # Ballots are accepted on-chain until this many seconds after the election is finalized
  voting-window-seconds: 600
  # The tally is decrypted once, this long after the deadline, so late blocks are indexed
  tally-settle-seconds: 20
