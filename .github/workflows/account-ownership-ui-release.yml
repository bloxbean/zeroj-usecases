name: release (account-ownership desktop UI)

# Builds the Account-Ownership desktop app as a native installer per OS, each with a bundled
# open-source JRE (jlink + jpackage), and attaches them to the GitHub Release.
#
#   preview : Actions ▸ Run workflow      → uploads the installers as workflow ARTIFACTS
#   release : push a repo tag  v<version>  → uploads the installers to the RELEASE for that tag
#
# jpackage cannot cross-compile, so one runner per OS. The JDK is an OpenJDK build (Amazon Corretto,
# GPLv2+CE) — never Oracle JDK — so the bundled runtime is freely redistributable. JavaFX ships
# inside the app's fat jar, so the base JDK needs no OpenJFX.
#
# The bundled runtime is jlinked from the setup-java JDK, so that JDK must carry the CVE-2026-114938
# ("Java4Shell") fix: Corretto 25.0.5.1+ has it, Temurin has no fixed 25 build yet. The guard steps
# fail the job if the JDK, or the jlinked runtime, is older than 25.0.5.1.
#
# Assets:
# Files are renamed to include os/arch/version; the app itself stays "AccountOwnershipProof".
#   account-ownership-proof-ui-macos_arm64_<v>.dmg      (macOS, Apple Silicon)
#   account-ownership-proof-ui-linux_arm64_<v>.deb      (Linux, aarch64)
#   account-ownership-proof-ui-linux_x86_64_<v>.deb     (Linux, x86_64)
#   account-ownership-proof-ui-windows_x86_64_<v>.msi   (Windows, x86_64 — built with WiX Toolset)

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14            # Apple Silicon
            platform: macos-arm64
          - os: ubuntu-22.04-arm    # aarch64
            platform: linux-arm64
          - os: ubuntu-22.04        # x86_64
            platform: linux-x86_64
          - os: windows-latest      # x86_64
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenJDK 25 (Corretto — GPLv2+CE, redistributable runtime)
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'

      # The installer bundles a runtime jlinked from this JDK. Refuse to build on a JDK without the
      # CVE-2026-114938 fix (a stale tool cache or a distribution change must not ship a vulnerable JRE).
      - name: Guard — JDK must be >= 25.0.5.1 (CVE-2026-114938)
        shell: bash
        env:
          MIN_JAVA: '25.0.5.1'
        run: |
          java -version
          v=$(java -XshowSettings:properties -version 2>&1 | tr -d '\r' | sed -n 's/^ *java\.runtime\.version = //p')
          num=${v%%[+-]*}
          echo "java.runtime.version=$v (numeric $num), required >= $MIN_JAVA"
          IFS=. read -r -a have <<< "$num"; IFS=. read -r -a need <<< "$MIN_JAVA"
          for i in 0 1 2 3; do
            h=${have[i]:-0}; n=${need[i]:-0}
            if (( h > n )); then exit 0; fi
            if (( h < n )); then echo "::error::JDK $v is older than $MIN_JAVA (CVE-2026-114938)"; exit 1; fi
          done

      - name: Resolve version (tag > version.properties)
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V=$(grep -m1 '^version' version.properties | cut -d= -f2); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Install WiX Toolset (Windows installer tooling)
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress

      - name: Build native installer (${{ matrix.platform }})
        shell: bash
        run: cd account-ownership && ./gradlew :ui:jpackageInstaller -PreleaseVersion=${{ steps.ver.outputs.version }} --no-daemon

      - name: Guard — bundled runtime must be >= 25.0.5.1 (CVE-2026-114938)
        shell: bash
        env:
          MIN_JAVA: '25.0.5.1'
        run: |
          rel=account-ownership/ui/build/runtime/release
          cat "$rel"
          v=$(tr -d '\r' < "$rel" | sed -n 's/^JAVA_VERSION="\(.*\)"$/\1/p')
          echo "bundled runtime JAVA_VERSION=$v, required >= $MIN_JAVA"
          IFS=. read -r -a have <<< "$v"; IFS=. read -r -a need <<< "$MIN_JAVA"
          for i in 0 1 2 3; do
            h=${have[i]:-0}; n=${need[i]:-0}
            if (( h > n )); then exit 0; fi
            if (( h < n )); then echo "::error::bundled runtime $v is older than $MIN_JAVA (CVE-2026-114938)"; exit 1; fi
          done

      # jpackage names the installer after the app (AccountOwnershipProof) with no os/arch, which is
      # ambiguous on the Releases page. Rename to account-ownership-proof-ui-<os>_<arch>_<version>.<ext>,
      # keeping the native extension (directly runnable) and the app name unchanged. Each runner
      # produces exactly one installer, so the loop renames that one.
      - name: Rename installer with os/arch/version
        shell: bash
        run: |
          cd account-ownership/ui/build/dist
          osarch="${{ matrix.platform }}"; osarch="${osarch//-/_}"
          ver="${{ steps.ver.outputs.version }}"
          shopt -s nullglob
          for f in *.dmg *.pkg *.msi *.exe *.deb; do
            mv -v "$f" "account-ownership-proof-ui-${osarch}_${ver}.${f##*.}"
          done
          ls -la

      - name: Upload workflow artifact (preview + release)
        uses: actions/upload-artifact@v4
        with:
          name: account-ownership-ui-${{ steps.ver.outputs.version }}-${{ matrix.platform }}
          path: |
            account-ownership/ui/build/dist/*.dmg
            account-ownership/ui/build/dist/*.pkg
            account-ownership/ui/build/dist/*.msi
            account-ownership/ui/build/dist/*.exe
            account-ownership/ui/build/dist/*.deb
          if-no-files-found: error

      - name: Attach to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            account-ownership/ui/build/dist/*.dmg
            account-ownership/ui/build/dist/*.msi
            account-ownership/ui/build/dist/*.exe
            account-ownership/ui/build/dist/*.deb
          fail_on_unmatched_files: false
